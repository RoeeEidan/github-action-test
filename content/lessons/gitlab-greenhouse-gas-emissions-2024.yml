en:
  heading: GitLab’s 2024 Greenhouse Gas Emissions and our Commitment to Reducing
    our Climate Impact
  body: >-
    GitLab is on a green mission! Our **FY24 Greenhouse Gas (GHG) Emissions
    inventory** gives you a peek into the climate impact of our remote-friendly
    operations. With no Scope 1 or Scope 2 emissions on the table, we're all
    about tackling those sneaky Scope 3 emissions. These mainly come from cloud
    services, remote work, business trips, and our investments.  


    Thanks to a top-notch methodology from the *Comprehensive Environmental Data
    Archive (CEDA)*, we're now capturing a clearer picture of our emissions.
    Plus, we’ve expanded our view by including emissions from investments,
    making our climate transparency a solid 10/10!  


    In a new green twist for FY24, GitLab has rolled out its first-ever
    **climate risk assessment** to forecast how climate change could impact our
    journey and shine a light on new opportunities. We’ve also moved the needle
    on eco-friendly partnerships with our supplier engagement program. This
    initiative nudges our top vendors to come clean on emissions and collars
    them into collective climate action (and we have big plans to grow this in
    FY25!).  


    On the offset front, we're making strides with the purchase of **8,580
    tonnes** of carbon removal credits. Our friends at *Trees for Global
    Benefits* are helping there, using reforestation for a greener, cleaner
    planet. Oh, and let's not forget, **877 tonnes** of carbon credits from FY23
    are now part of our environmental history.  


    Want to dive deeper into GitLab’s FY24 GHG efforts? [Learn more
    here](https://about.gitlab.com/handbook/).  


    **Quiz Time:** 

    What is the primary source of GitLab’s greenhouse gas emissions?  

    - A) On-site office energy use  

    - B) Scope 3 emissions from cloud services, remote work, and business
    travel  

    - C) Transportation of physical products  

    - D) Fossil fuel-powered data centers  


    *Correct answer: B) Scope 3 emissions from cloud services, remote work, and
    business travel*
  message:
    heading: Explore GitLab’s 2024 Greenhouse Gas Emissions 🌿
    body: GitLab's latest GHG report shows our path toward a greener future through
      innovative climate actions and reduction. Dive into the details!
  popup:
    heading: GitLab’s 2024 GHG Report
fr:
  heading: Émissions de Gaz à Effet de Serre de GitLab pour 2024 et notre
    Engagement pour Réduire notre Impact Climatique
  body: >-
    GitLab se lance dans une mission verte! Notre **inventaire des Émissions de
    Gaz à Effet de Serre (GES) de l'exercice 2024** vous offre un aperçu de
    l'impact climatique de nos opérations favorables au télétravail. Avec aucune
    émission de Scope 1 ou Scope 2 à l'horizon, nous sommes concentrés sur la
    lutte contre ces insaisissables émissions du Scope 3. Celles-ci proviennent
    principalement des services infonuagiques, du télétravail, des voyages
    d'affaires et de nos investissements.


    Grâce à une méthodologie de premier ordre du *Comprehensive Environmental
    Data Archive (CEDA)*, nous avons maintenant une image plus claire de nos
    émissions. De plus, nous avons élargi notre champ de vision en incluant les
    émissions provenant des investissements, rendant notre transparence
    climatique solide comme du roc!


    Dans une nouvelle tournure écologique pour l'exercice 2024, GitLab a lancé
    sa toute première **évaluation des risques climatiques** pour prévoir
    comment le changement climatique pourrait impacter notre parcours et mettre
    en lumière de nouvelles opportunités. Nous avons également avancé dans les
    partenariats éco-responsables avec notre programme d'engagement des
    fournisseurs. Cette initiative incite nos principaux fournisseurs à être
    transparents sur les émissions et les engage dans une action climatique
    collective (et nous avons de grands projets pour étendre cela en FY25!).


    Du côté des compensations, nous progressons avec l'achat de **8 580 tonnes**
    de crédits de retrait de carbone. Nos amis de *Trees for Global Benefits*
    aident dans ce domaine, en utilisant la reforestation pour un monde plus
    vert et plus propre. Oh, et n'oublions pas, **877 tonnes** de crédits
    carbone de l'exercice 2023 font désormais partie de notre histoire
    environnementale.


    Vous voulez en savoir plus sur les efforts GES de l'exercice 2024 de GitLab?
    [En savoir plus ici](https://about.gitlab.com/handbook/).


    **Quiz:**

    Quelle est la principale source des émissions de gaz à effet de serre de
    GitLab ?

    - A) Utilisation d'énergie sur site de bureau

    - B) Émissions du Scope 3 provenant des services infonuagiques, du
    télétravail, et des voyages d'affaires

    - C) Transport des produits physiques

    - D) Centres de données alimentés par combustibles fossiles


    *Réponse correcte: B) Émissions du Scope 3 provenant des services
    infonuagiques, du télétravail, et des voyages d'affaires*
