en:
  heading: Make sure to stay on top of this
  body: >-
    GitLab is on a green mission! Our **FY24 Greenhouse Gas (GHG) Emissions
    inventory** gives you a peek into the climate impact of our remote-friendly
    operations. With no Scope 1 or Scope 2 emissions on the table, we're all
    about tackling those sneaky Scope 3 emissions. These mainly come from cloud
    services, remote work, business trips, and our investments.  


    Thanks to a top-notch methodology from the *Comprehensive Environmental Data
    Archive (CEDA)*, we're now capturing a clearer picture of our emissions.
    Plus, we’ve expanded our view by including emissions from investments,
    making our climate transparency a solid 10/10!  


    In a new green twist for FY24, GitLab has rolled out its first-ever
    **climate risk assessment** to forecast how climate change could impact our
    journey and shine a light on new opportunities. We’ve also moved the needle
    on eco-friendly partnerships with our supplier engagement program. This
    initiative nudges our top vendors to come clean on emissions and collars
    them into collective climate action (and we have big plans to grow this in
    FY25!).  


    On the offset front, we're making strides with the purchase of **8,580
    tonnes** of carbon removal credits. Our friends at *Trees for Global
    Benefits* are helping there, using reforestation for a greener, cleaner
    planet. Oh, and let's not forget, **877 tonnes** of carbon credits from FY23
    are now part of our environmental history.  


    Want to dive deeper into GitLab’s FY24 GHG efforts? [Learn more
    here](https://about.gitlab.com/handbook/).  


    **Quiz Time:** 

    What is the primary source of GitLab’s greenhouse gas emissions?  

    - A) On-site office energy use  

    - B) Scope 3 emissions from cloud services, remote work, and business
    travel  

    - C) Transportation of physical products  

    - D) Fossil fuel-powered data centers  


    *Correct answer: B) Scope 3 emissions from cloud services, remote work, and
    business travel*
  message:
    heading: Explore GitLab’s 2024 Greenhouse Gas Emissions 🌿
    body: GitLab's latest GHG report shows our path toward a greener future through
      innovative climate actions and reduction. Dive into the details!
  popup:
    heading: GitLab’s 2024 GHG Report
fr:
  heading: Assurez-vous de rester à la page
  body: >-
    GitLab est sur une mission verte! Notre **inventaire des émissions de gaz à
    effet de serre (GES) pour l'année fiscale 24** vous offre un aperçu de
    l'impact climatique de nos opérations favorables au télétravail. Sans
    émissions de Scope 1 ou de Scope 2 en jeu, nous nous concentrons sur ces
    éternelles émissions de Scope 3. Celles-ci proviennent principalement des
    services en nuage, du travail à distance, des voyages d'affaires et de nos
    investissements.  


    Grâce à une méthodologie de pointe élaborée par le *Comprehensive
    Environmental Data Archive (CEDA)*, nous avons maintenant une image plus
    claire de nos émissions. De plus, nous avons élargi notre horizon en
    incluant les émissions provenant des investissements, rendant notre
    transparence climatique un solide 10/10!  


    Dans un nouveau tournant écologique pour l'année fiscale 24, GitLab a
    déployé sa première **évaluation des risques climatiques** pour prévoir
    comment les changements climatiques pourraient affecter notre parcours et
    mettre en lumière de nouvelles opportunités. Nous avons également fait
    avancer le cadran sur les partenariats écologiques avec notre programme
    d'engagement des fournisseurs. Cette initiative pousse nos principaux
    fournisseurs à être transparents sur leurs émissions et les incite à une
    action climatique collective (et nous avons de grands plans pour élargir
    cela en FY25!).  


    Sur le front de la compensation, nous faisons des progrès avec l'achat de
    **8 580 tonnes** de crédits de retrait de carbone. Nos amis de *Trees for
    Global Benefits* nous aident ici, en utilisant la reforestation pour un
    monde plus vert et propre. Oh, et n'oublions pas, **877 tonnes** de crédits
    de carbone de l'année fiscale 23 font désormais partie de notre histoire
    environnementale.  


    Vous voulez plonger plus profondément dans les efforts GES 24 de GitLab ?
    [En apprenez plus ici](https://about.gitlab.com/handbook/).  


    **Quiz :** 

    Quelle est la principale source des émissions de gaz à effet de serre de
    GitLab?  

    - A) Utilisation énergétique des bureaux sur site  

    - B) Émissions de Scope 3 provenant des services en nuage, du travail à
    distance et des voyages d'affaires  

    - C) Transport de produits physiques  

    - D) Centres de données alimentés par des combustibles fossiles  


    *Réponse correcte : B) Émissions de Scope 3 provenant des services en nuage,
    du travail à distance et des voyages d'affaires*
  message:
    heading: Explorez les émissions de gaz à effet de serre 2024 de GitLab 🌿
    body: Le dernier rapport GES de GitLab montre notre cheminement vers un avenir
      plus vert grâce à des actions climatiques innovantes et des réductions.
      Plongez dans les détails!
  popup:
    heading: Rapport GES 2024 de GitLab
